<ion-header>
  <ion-toolbar color="tertiary">
    <ion-buttons slot="start">
      <ion-button color="light" (click)="regresar()">Regresar</ion-button>
    </ion-buttons>
    <ion-title>{{ actividadInfo?.titulo || 'Word Connect' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" style="--background: #1e1e2f; color: #fff;">
  <div style="max-width: 600px; margin: 0 auto; text-align: center;">

    <!-- PANEL DE TIEMPO Y PUNTAJE -->
     <ion-card style="background: #2b2b40; color: #fff; margin-bottom: 20px;">
      <ion-card-content style="font-size: 1rem;">
        <div style="display: flex; justify-content: space-between;">
          <div>⏱️ Tiempo: {{ tiempoFormateado }}</div>
          <div>⭐ Puntos: {{ puntajeActual }}</div>
        </div>
      </ion-card-content>
    </ion-card>

    <!-- PISTA CONCEPTUAL DEL TEMA -->
    <ion-card style="background: #2b2b40; color: #fff; margin-bottom: 20px;">
      <ion-card-header>
        <ion-card-title style="color: #ffd700; font-size: 1.1rem;">💡 Pista Actual:</ion-card-title>
      </ion-card-header>
      <ion-card-content style="font-size: 1rem;">
        {{ pistaActual }}
      </ion-card-content>
    </ion-card>

    <!-- PALABRAS POR DESCUBRIR (CASILLAS) -->
    <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 20px;">
      <div *ngFor="let p of listaPalabras" style="background: #3b3b58; padding: 10px 15px; border-radius: 8px; font-weight: bold; letter-spacing: 3px;">
        <span *ngIf="p.adivinada" style="color: #4caf50;">{{ p.palabra }}</span>
        <span *ngIf="!p.adivinada" style="color: #888;">{{ OcultarPalabra(p.palabra) }}</span>
      </div>
    </div>

    <!-- PREVIEW DE LA PALABRA QUE EL ALUMNO ESTÁ CONECTANDO -->
    <div style="height: 30px; font-size: 1.4rem; font-weight: bold; color: #00e676; margin-bottom: 10px;">
      {{ palabraSeleccionada }}
    </div>

    <!-- RUEDA CANVAS INTERACTIVA (HTML5 CANVAS 2D) -->
    <div style="display: flex; justify-content: center;">
      <canvas #canvasJuego width="320" height="320" style="touch-action: none; cursor: pointer;"></canvas>
    </div>

    <!-- MENSAJE DE VICTORIA -->
    <div *ngIf="juegoCompletado" style="margin-top: 20px;">
      <h2 style="color: #00e676;">🎉 ¡Felicidades! Completaste el Nivel</h2>
      <ion-button color="success" expand="block" (click)="regresar()">
        Volver al Panel de Clases
      </ion-button>
    </div>

  </div>
</ion-content>
